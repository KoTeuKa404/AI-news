services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Kyiv}
      TZ: ${GENERIC_TIMEZONE:-Europe/Kyiv}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-http://host.docker.internal:4545/v1}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?Set AI_GATEWAY_API_KEY in .env}
      AI_MODEL: ${AI_MODEL:-local-main}
      CONTENT_STORE_BASE_URL: ${CONTENT_STORE_BASE_URL:-http://content-store:8080}
      CONTENT_CLIENT_ID: ${CONTENT_CLIENT_ID:-telegram-default}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_REVIEW_CHAT_ID: ${TELEGRAM_REVIEW_CHAT_ID:?Set TELEGRAM_REVIEW_CHAT_ID in .env}
      TELEGRAM_TARGET_CHANNEL_ID: ${TELEGRAM_TARGET_CHANNEL_ID:?Set TELEGRAM_TARGET_CHANNEL_ID in .env}
      TELEGRAM_MODERATOR_IDS: ${TELEGRAM_MODERATOR_IDS:-}
      TELEGRAM_STYLE_PROFILE: ${TELEGRAM_STYLE_PROFILE:-Експертний, короткий і практичний стиль для Telegram-аудиторії.}
      NEWS_FEED_URL_1: ${NEWS_FEED_URL_1:-https://hnrss.org/frontpage}
    depends_on:
      postgres:
        condition: service_healthy
      content-store:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

  content-store:
    build:
      context: ./services/content-store
    restart: unless-stopped
    ports:
      - "127.0.0.1:18090:8080"
    environment:
      CONTENT_STORE_DB_HOST: postgres
      CONTENT_STORE_DB_PORT: 5432
      CONTENT_STORE_DB_NAME: ${POSTGRES_DB:-n8n}
      CONTENT_STORE_DB_USER: ${POSTGRES_USER:-n8n}
      CONTENT_STORE_DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      CONTENT_STORE_MIN_CONFIDENCE: ${CONTENT_STORE_MIN_CONFIDENCE:-0.70}
      CONTENT_STORE_MIN_QUALITY_SCORE: ${CONTENT_STORE_MIN_QUALITY_SCORE:-0.70}
      CONTENT_STORE_PROCESSING_MAX_ATTEMPTS: ${CONTENT_STORE_PROCESSING_MAX_ATTEMPTS:-3}
      CONTENT_STORE_PROCESSING_RETRY_DELAY_SECONDS: ${CONTENT_STORE_PROCESSING_RETRY_DELAY_SECONDS:-300}
      CONTENT_STORE_PROCESSING_STALE_SECONDS: ${CONTENT_STORE_PROCESSING_STALE_SECONDS:-1800}
      CONTENT_STORE_FETCH_TIMEOUT_SECONDS: ${CONTENT_STORE_FETCH_TIMEOUT_SECONDS:-10}
      CONTENT_STORE_FETCH_MAX_BYTES: ${CONTENT_STORE_FETCH_MAX_BYTES:-1500000}
      CONTENT_STORE_ALLOWED_SOURCE_HOSTS: ${CONTENT_STORE_ALLOWED_SOURCE_HOSTS:-}
      CONTENT_STORE_DEFAULT_CLIENT_ID: ${CONTENT_STORE_DEFAULT_CLIENT_ID:-telegram-default}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  n8n_data:
